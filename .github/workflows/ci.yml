name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  contracts:
    name: Generated code matches contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd engine && uv sync
      - run: cd web && npm ci
      - run: make gen-check

  core:
    name: Core (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paddock
          POSTGRES_PASSWORD: paddock
          POSTGRES_DB: paddock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paddock" --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      PADDOCK_TEST_DATABASE_URL: postgres://paddock:paddock@localhost:5432/paddock_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - run: cd core && go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: core
      - run: cd core && go test -race -count=1 ./...
      - name: Dependency audit
        run: cd core && go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python:
    name: Engine and agent tests (Python, Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd engine && uv sync
      - run: cd agent && uv sync
      - name: Lint and format (all Python in the repo)
        run: |
          uv run --project engine ruff check .
          uv run --project engine ruff format --check .
      - name: Type check (mypy --strict)
        run: cd engine && uv run mypy
      - name: Engine tests
        run: cd engine && uv run pytest
      - name: Agent tests (real Lua under LuaJIT)
        run: cd agent && uv run pytest
      - name: Dependency audit
        run: |
          cd engine
          uv export --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit --requirement requirements.txt --require-hashes --disable-pip

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      - run: cd web && npm run lint
      - run: cd web && npm test
      - run: cd web && npm run build
      - name: Dependency audit
        run: cd web && npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
