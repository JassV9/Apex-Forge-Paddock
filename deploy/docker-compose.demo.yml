# Demo mode: `make demo`. The same stack, fed from the recorded sessions in datasets/demo
# instead of the game. It runs as its own Compose project (paddock-demo), so its database
# never mixes with real sessions.
services:
  core:
    volumes:
      - type: bind
        source: ../datasets/demo/spool
        target: /spool
        read_only: true
      # no game to read them: run plans and setups stay inside the demo project
      - type: volume
        source: demo-outbox
        target: /outbox

  engine:
    environment:
      # the demo is the same for everyone: template text, no hosted model, no key
      PADDOCK_LLM_PROVIDER: none

volumes:
  demo-outbox:
