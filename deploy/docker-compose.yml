# Local development stack: `make dev`. Every port is bound to 127.0.0.1 only.
# The database password below is a local-development default, not a secret.
name: paddock

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paddock
      POSTGRES_PASSWORD: paddock
      POSTGRES_DB: paddock
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paddock -d paddock"]
      interval: 2s
      timeout: 2s
      retries: 15

  core:
    build: ../core
    environment:
      PADDOCK_HTTP_ADDR: ":8080"
      PADDOCK_DATABASE_URL: postgres://paddock:paddock@postgres:5432/paddock?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build: ../engine
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ../web
    environment:
      PADDOCK_CORE_URL: http://core:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - core

volumes:
  postgres-data:
