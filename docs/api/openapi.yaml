openapi: 3.1.0
info:
  title: Apex Forge Paddock core API
  version: 0.3.0
  description: >
    REST API of the core process, used by the web dashboard. This file is written first; the
    TypeScript client types in web/src/api/schema.d.ts are generated from it (`make gen`).
    Response bodies are the JSON Schemas in contracts/.
servers:
  - url: /api
    description: Core behind the web dev server or reverse proxy (the /api prefix is stripped).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness of the core process and whether it can reach its database.
      responses:
        "200":
          description: >
            Core is running. `status` is `degraded` when PostgreSQL cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /sessions:
    get:
      operationId: listSessions
      summary: Recorded sessions, newest first.
      responses:
        "200":
          description: Every session core has ingested, with how much was recorded in it.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
  /sessions/{id}/setup:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listSetupItems
      summary: The changeable items of the setup an experiment on this session would start from.
      description: >
        The setup is the champion of the session's car and track, or before their first
        experiment the setup the session's latest pass was driven on.
      responses:
        "200":
          description: The items, by label.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupItem"
        "422":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/diagnosis:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getDiagnosis
      summary: The newest stored diagnosis of the session.
      responses:
        "200":
          $ref: "#/components/responses/Diagnosis"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: diagnoseSession
      summary: Diagnose the session now and keep the answer.
      description: >
        Core sends the session's valid passes and the setup an experiment would start from
        to the engine. With setup data only passes driven on that setup count. Earlier
        diagnoses are kept; this one becomes the newest.
      responses:
        "201":
          $ref: "#/components/responses/Diagnosis"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/proposals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getProposals
      summary: The experiments the session's newest diagnosis names, ranked.
      description: >
        Each change is ranked by the improvement the car's sensitivity profile expects of
        it per lap of driving. A change this car measured as negligible or as worse is
        listed under skipped with the reason; a prior from another car never rules a
        change out.
      responses:
        "200":
          description: Ranked and skipped candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposals"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /sensitivity:
    get:
      operationId: listSensitivity
      summary: Every car's sensitivity profile, rebuilt from the finished experiments.
      description: >
        One row per item, clicks, channel and corner class: pooled from the car's own
        finished one-factor experiments, or a prior from another car's item with the same
        job, flagged is_prior. The profiles are rebuilt and stored on every request.
      responses:
        "200":
          description: One profile per car.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensitivityProfile"
        "502":
          $ref: "#/components/responses/Problem"
  /scorecard:
    get:
      operationId: getScorecard
      summary: How often the predictions written down before an experiment came true.
      responses:
        "200":
          description: Counts over the whole ledger, by hypothesis source and by state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scorecard"
  /experiments:
    get:
      operationId: listExperiments
      summary: The ledger. Every experiment, newest first, whatever its outcome.
      responses:
        "200":
          description: Every experiment with its plan, results, verdict and history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"
    post:
      operationId: createExperiment
      summary: Propose an experiment. One setup item, moved by some clicks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentCreate"
      responses:
        "201":
          $ref: "#/components/responses/Experiment"
        "422":
          $ref: "#/components/responses/Problem"
  /experiments/{id}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      operationId: getExperiment
      summary: One experiment.
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/Problem"
  /experiments/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
      - name: action
        in: path
        required: true
        description: >
          plan: ask the engine what an A-B-A-B plan can detect (proposed to planned).
          start: write the run plan and both setups for the agent (planned to running).
          evaluate: have the engine judge the driven passes (running to accepted, tradeoff,
          inconclusive, or rejected and then reverted).
          extend: two more blocks for an inconclusive experiment, at most twice.
          revert: go back to the baseline (inconclusive, tradeoff, or the current champion).
          abort: stop a running experiment.
          discard: drop an experiment that was not driven.
        schema:
          type: string
          enum: [plan, start, evaluate, extend, revert, abort, discard]
    post:
      operationId: actOnExperiment
      summary: Move an experiment along its state machine.
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /experiments/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      operationId: decideExperiment
      summary: The driver's call on a trade-off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentDecision"
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExperimentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Experiment:
      description: The experiment as it is after the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Experiment"
    Diagnosis:
      description: What the session's passes say about the car.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Diagnosis"
    Problem:
      description: >
        The request was refused. 404: no such experiment, session or diagnosis. 409: not
        possible in the experiment's current state, or the session has no pass to
        diagnose yet. 422: the request is not valid. 502: the engine did not
        answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      $ref: "../../contracts/health.schema.json"
    SessionSummary:
      $ref: "../../contracts/session_summary.schema.json"
    SetupItem:
      $ref: "../../contracts/setup_item.schema.json"
    Experiment:
      $ref: "../../contracts/experiment.schema.json"
    ExperimentCreate:
      $ref: "../../contracts/experiment_create.schema.json"
    Diagnosis:
      $ref: "../../contracts/diagnosis.schema.json"
    ExperimentDecision:
      $ref: "../../contracts/experiment_decision.schema.json"
    SensitivityProfile:
      $ref: "../../contracts/sensitivity_profile.schema.json"
    Proposals:
      $ref: "../../contracts/proposals.schema.json"
    Scorecard:
      $ref: "../../contracts/scorecard.schema.json"
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          description: What went wrong, in words.
          type: string
