openapi: 3.1.0
info:
  title: Apex Forge Paddock core API
  version: 0.4.0
  description: >
    REST API of the core process, used by the web dashboard. This file is written first; the
    TypeScript client types in web/src/api/schema.d.ts are generated from it (`make gen`).
    Response bodies are the JSON Schemas in contracts/.
servers:
  - url: /api
    description: Core behind the web dev server or reverse proxy (the /api prefix is stripped).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness of the core process and whether it can reach its database.
      responses:
        "200":
          description: >
            Core is running. `status` is `degraded` when PostgreSQL cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /sessions:
    get:
      operationId: listSessions
      summary: Recorded sessions, newest first.
      responses:
        "200":
          description: Every session core has ingested, with how much was recorded in it.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
  /sessions/{id}/setup:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listSetupItems
      summary: The changeable items of the setup an experiment on this session would start from.
      description: >
        The setup is the champion of the session's car and track, or before their first
        experiment the setup the session's latest pass was driven on.
      responses:
        "200":
          description: The items, by label.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupItem"
        "422":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/diagnosis:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getDiagnosis
      summary: The newest stored diagnosis of the session.
      responses:
        "200":
          $ref: "#/components/responses/Diagnosis"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: diagnoseSession
      summary: Diagnose the session now and keep the answer.
      description: >
        Core sends the session's valid passes and the setup an experiment would start from
        to the engine. With setup data only passes driven on that setup count. Earlier
        diagnoses are kept; this one becomes the newest.
      responses:
        "201":
          $ref: "#/components/responses/Diagnosis"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/proposals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getProposals
      summary: The experiments the session's newest diagnosis names, ranked.
      description: >
        Each change is ranked by the improvement the car's sensitivity profile expects of
        it per lap of driving. A change this car measured as negligible or as worse is
        listed under skipped with the reason; a prior from another car never rules a
        change out.
      responses:
        "200":
          description: Ranked and skipped candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposals"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/base-setup:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: buildBaseSetup
      summary: Build a base setup from what the car measured, and propose the experiment that judges it.
      description: >
        The baseline is the setup an experiment on this session would start from. A change
        goes in when the car's own pooled measurement on corner time over all corners lies
        wholly on the faster side of zero; never a prior, a row flagged non-linear, a change
        measured worse on a guardrail, or a paired item; one change per item, within its
        range. The prediction is the sum of the estimates with the summed variances;
        interactions were not measured, so the combination is judged as its own experiment
        (kind base) against the baseline. When nothing qualifies the answer is 409 with what
        the car measured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseSetupCreate"
      responses:
        "201":
          description: The base setup, and the id of the proposed experiment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseSetupReply"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: No measured change qualifies. The body says what the car measured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseSetupReply"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/passes:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listPasses
      summary: Every corner pass of the session, with best, median and spread per corner.
      responses:
        "200":
          description: The stored passes in the order driven, and the corners they cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPasses"
        "404":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/passes/{seq}/samples:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: max_points
        in: query
        description: Most samples per column in the reply (default 1000); more are thinned evenly.
        schema:
          type: integer
          minimum: 50
          maximum: 5000
    get:
      operationId: getPassSamples
      summary: The raw samples of one pass from the session's Parquet files.
      responses:
        "200":
          description: Column arrays of equal length, and the slip angle per axle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassTrace"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/reference:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: setup_hash
        in: query
        description: The session's setup to compare (default the setup of its latest pass).
        schema:
          type: string
          minLength: 1
    get:
      operationId: getSessionReference
      summary: Every corner of the session against AC's AI on the same car, track and setup.
      description: >
        Per corner the driver's best and median zone time, the AI's median and spread on the
        same setup (or the nearest setup the AI drove, said per corner), the gaps, and a
        class: driver when the typical pass is slower than the AI by more than the AI's own
        spread, car otherwise. Technique metrics that differ are listed with their counts.
      responses:
        "200":
          description: The comparison, corner by corner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReference"
        "404":
          $ref: "#/components/responses/Problem"
  /reference:
    parameters:
      - name: car
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: track
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: layout
        in: query
        schema:
          type: string
      - name: setup_hash
        in: query
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getAiReference
      summary: The AI's median zone time per corner on one car, track and setup.
      description: >
        Small, for the in-game hotlap display. Corner numbers are those of the track's
        newest corner map; a corner with fewer than three AI passes on exactly this setup is
        left out.
      responses:
        "200":
          description: The AI's times; no corners when the AI never drove this setup here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReference"
        "422":
          $ref: "#/components/responses/Problem"
  /sensitivity:
    get:
      operationId: listSensitivity
      summary: Every car's sensitivity profile, rebuilt from the finished experiments.
      description: >
        One row per item, clicks, channel and corner class: pooled from the car's own
        finished one-factor experiments, or a prior from another car's item with the same
        job, flagged is_prior. The profiles are rebuilt and stored on every request.
      responses:
        "200":
          description: One profile per car.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensitivityProfile"
        "502":
          $ref: "#/components/responses/Problem"
  /scorecard:
    get:
      operationId: getScorecard
      summary: How often the predictions written down before an experiment came true.
      responses:
        "200":
          description: Counts over the whole ledger, by hypothesis source and by state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scorecard"
  /experiments:
    get:
      operationId: listExperiments
      summary: The ledger. Every experiment, newest first, whatever its outcome.
      responses:
        "200":
          description: Every experiment with its plan, results, verdict and history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"
    post:
      operationId: createExperiment
      summary: Propose an experiment. One setup item, moved by some clicks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentCreate"
      responses:
        "201":
          $ref: "#/components/responses/Experiment"
        "422":
          $ref: "#/components/responses/Problem"
  /experiments/{id}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      operationId: getExperiment
      summary: One experiment.
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/Problem"
  /experiments/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
      - name: action
        in: path
        required: true
        description: >
          plan: ask the engine what an A-B-A-B plan can detect (proposed to planned).
          start: write the run plan and both setups for the agent (planned to running).
          evaluate: have the engine judge the driven passes (running to accepted, tradeoff,
          inconclusive, or rejected and then reverted).
          extend: two more blocks for an inconclusive experiment, at most twice.
          revert: go back to the baseline (inconclusive, tradeoff, or the current champion).
          abort: stop a running experiment.
          discard: drop an experiment that was not driven.
        schema:
          type: string
          enum: [plan, start, evaluate, extend, revert, abort, discard]
    post:
      operationId: actOnExperiment
      summary: Move an experiment along its state machine.
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /experiments/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      operationId: decideExperiment
      summary: The driver's call on a trade-off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentDecision"
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /sessions/{id}/training:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: startTraining
      summary: Start an AI training program on the session's car and track.
      description: >
        AC's AI drives the session's top-ranked experiments one after another on the car's
        calibrated grip. Each is judged when its laps are in; the next is taken from the
        ranking that verdict changed, skipping items the program has already tested. An open
        AI experiment on the car is taken over as the first step. 409 when a program is
        already open on the car or a human's experiment is on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingCreate"
      responses:
        "201":
          $ref: "#/components/responses/TrainingProgram"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /training:
    get:
      operationId: listTraining
      summary: Every training program, newest first.
      responses:
        "200":
          description: The programs with their steps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingProgram"
  /training/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: stopTraining
      summary: Stop a program. An experiment it started stays as it is, to finish or abort.
      responses:
        "200":
          $ref: "#/components/responses/TrainingProgram"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExperimentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    TrainingProgram:
      description: The training program as it is after the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingProgram"
    Experiment:
      description: The experiment as it is after the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Experiment"
    Diagnosis:
      description: What the session's passes say about the car.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Diagnosis"
    Problem:
      description: >
        The request was refused. 404: no such experiment, session, pass or diagnosis, or the
        pass has no stored samples. 409: not
        possible in the experiment's current state, or the session has no pass to
        diagnose yet. 422: the request is not valid. 502: the engine did not
        answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      $ref: "../../contracts/health.schema.json"
    SessionSummary:
      $ref: "../../contracts/session_summary.schema.json"
    SetupItem:
      $ref: "../../contracts/setup_item.schema.json"
    Experiment:
      $ref: "../../contracts/experiment.schema.json"
    ExperimentCreate:
      $ref: "../../contracts/experiment_create.schema.json"
    Diagnosis:
      $ref: "../../contracts/diagnosis.schema.json"
    ExperimentDecision:
      $ref: "../../contracts/experiment_decision.schema.json"
    SensitivityProfile:
      $ref: "../../contracts/sensitivity_profile.schema.json"
    Proposals:
      $ref: "../../contracts/proposals.schema.json"
    Scorecard:
      $ref: "../../contracts/scorecard.schema.json"
    BaseSetupCreate:
      $ref: "../../contracts/base_setup_create.schema.json"
    BaseSetupReply:
      $ref: "../../contracts/base_setup_reply.schema.json"
    SessionPasses:
      $ref: "../../contracts/session_passes.schema.json"
    PassTrace:
      $ref: "../../contracts/pass_trace.schema.json"
    TrainingCreate:
      $ref: "../../contracts/training_create.schema.json"
    TrainingProgram:
      $ref: "../../contracts/training_program.schema.json"
    SessionReference:
      $ref: "../../contracts/session_reference.schema.json"
    AiReference:
      $ref: "../../contracts/ai_reference.schema.json"
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          description: What went wrong, in words.
          type: string
