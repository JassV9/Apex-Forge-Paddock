[project]
name = "paddock-engine"
version = "0.1.0"
description = "Apex Forge: Paddock analysis engine (features, statistics, diagnosis, sensitivity)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paddock_engine"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["paddock_engine", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
